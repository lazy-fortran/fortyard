name = "fortyard"
version = "0.1.0"
license = "proprietary"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
description = "Self-hosted Fortran forge"

[build]
auto-executables = false
auto-tests = true
link = ["sqlite3"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
openmp = "*"
fy_parser = { path = "parser" }
fx = { git = "https://github.com/lazy-fortran/fx.git", rev = "dccc8c5ca05e4ebccc57b0a16390f753cb4d26a2" }
fortui = { git = "https://github.com/lazy-fortran/fortui.git", rev = "a4e8895e3c73ceba4ce94700b7bec576569ecfb0" }

[[executable]]
name = "fy"
source-dir = "app"
main = "fy.f90"

[[extra.fo.inputs]]
path = "deploy"
kind = "directory"
role = "test-fixture"

[[extra.fo.inputs]]
path = "scripts"
kind = "directory"
role = "test-fixture"
