name = "fortyard"
version = "0.1.0"
license = "proprietary"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
description = "Self-hosted Fortran forge"

[build]
auto-executables = false
auto-tests = true
link = ["sqlite3"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
openmp = "*"
fx = { git = "https://github.com/lazy-fortran/fx.git" }
fortui = { git = "git@github.com:lazy-fortran/fortui.git", rev = "f432a91aed253cd7aa3afb4c1ef0fa4c5b8e7470" }

[[executable]]
name = "fy"
source-dir = "app"
main = "fy.f90"
