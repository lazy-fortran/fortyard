name = "fortyard"
version = "0.1.0"
license = "proprietary"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
description = "Self-hosted Fortran forge"

[build]
auto-executables = false
auto-tests = true
link = ["sqlite3"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
openmp = "*"
fx = { git = "https://github.com/lazy-fortran/fx.git", rev = "ffa6600e54942947f77d93fa3ac3806f43896a34" }
fortui = { git = "https://github.com/lazy-fortran/fortui.git", rev = "0345ae2c29cb70d786377ca8952f122c01a67a4d" }

[[executable]]
name = "fy"
source-dir = "app"
main = "fy.f90"
