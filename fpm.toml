name = "fortyard"
version = "0.1.0"
license = "proprietary"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
description = "Self-hosted Fortran forge"

[build]
auto-executables = false
auto-tests = true
link = ["sqlite3"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
openmp = "*"
fx = { git = "https://github.com/lazy-fortran/fx.git", rev = "ffa6600e54942947f77d93fa3ac3806f43896a34" }
fortui = { git = "git@github.com:lazy-fortran/fortui.git", rev = "10da6e56cb8dbe20e53c626cd1d8e183279e39c9" }

[[executable]]
name = "fy"
source-dir = "app"
main = "fy.f90"
