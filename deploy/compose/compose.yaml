# fortyard behind a reverse proxy at @BASE@. Releases are files under
# ./releases; the server follows ./current and becomes each new release
# itself, so no container is rebuilt or restarted for an update.
# Server and runner are on internal networks without a route out and without
# a DNS server; they reach the internet only through egress proxies of their
# role (deploy/egress), and the reverse proxy reaches the server only through
# the relay, which publishes the server's port on the host at @RELAY@
# (doc/backends.md, "Network allowlist" and "Isolation").
x-locked: &locked
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Container names resolve; other names only through the egress proxy.
  dns: [127.0.0.1]
x-fortyard: &fortyard
  <<: *locked
  image: @IMAGE@
  user: "@UID@"
x-egress: &egress
  <<: *locked
  image: @EGRESS_IMAGE@
  user: "@UID@"
  dns: []
  tmpfs: ["/tmp:size=64m"]
  mem_limit: 256m
  cpus: 1
  pids_limit: 128
  # Every request is logged on standard output; Docker keeps 30 MB of it.
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  fortyard:
    <<: *fortyard
    container_name: fortyard
    tmpfs: ["/tmp:size=512m,exec"]
    environment:
      FY_HOME: /fy
      FY_URL: http://127.0.0.1:8740
      FY_PUBLIC_URL: "@PUBLIC_URL@"
      FY_BASE: "@BASE@"
      FY_RESTART: follow
      FY_CHECKS: runner
      TMPDIR: /tmp
      # Sign-in, review model, git and curl go out through the proxy.
      FY_PROXY: http://fortyard-egress-server:3128
      http_proxy: http://fortyard-egress-server:3128
      https_proxy: http://fortyard-egress-server:3128
      HTTP_PROXY: http://fortyard-egress-server:3128
      HTTPS_PROXY: http://fortyard-egress-server:3128
      no_proxy: 127.0.0.1,localhost
      NO_PROXY: 127.0.0.1,localhost
      # Mail when main breaks or passes again (fy_mail), through the relays of
      # the egress list mail.txt; the values come from .env beside this file.
      FY_SMTP_URL: ${FY_SMTP_URL:-}
      FY_MAIL_FROM: ${FY_MAIL_FROM:-}
      FY_MAIL_TO: ${FY_MAIL_TO:-}
      FY_MAIL_PROXY: http://fortyard-egress-server:3128
    volumes:
      - .:/fy
      # ssh to GitHub as ssh.github.com:443 through the proxy; ssh needs an
      # account for the user it runs as.
      - ./bin/ssh_config:/etc/ssh/ssh_config.d/fortyard.conf:ro
      - ./bin/passwd:/etc/passwd:ro
      # fo and fy at main, kept there by the host's follow-tools.sh; the
      # lander formats with this fo.
      - "@TOOLS@:/opt/fy-tools/bin:ro"
    entrypoint: ["/fy/bin/start.sh"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    networks: [yard, server-out]
  fortyard-egress-server:
    <<: *egress
    container_name: fortyard-egress-server
    environment:
      FY_EGRESS_ROLE: server
      FY_EGRESS_LOG: /log
    volumes:
      - ./egress/server:/log
    networks: [server-out, egress]
  # The only way in: Traefik's route for fortyard points to @RELAY@.
  fortyard-relay:
    <<: *locked
    image: @RELAY_IMAGE@
    container_name: fortyard-relay
    user: "65534:65534"
    command: ["TCP-LISTEN:8740,fork,reuseaddr", "TCP:fortyard:8740"]
    ports: ["@RELAY@:8740"]
    mem_limit: 128m
    cpus: 1
    pids_limit: 512
    networks: [yard, edge]
    depends_on: [fortyard]
  # Landing checks, split in two: the controller holds the runner token,
  # claims checks and reports them, and reaches the server on the internal
  # network; it needs no internet. The executor next to it checks out and runs
  # the checks without the token and reaches the internet only through the
  # executor proxy. They share the work volume.
  fortyard-runner:
    <<: *fortyard
    container_name: fortyard-runner
    tmpfs: ["/tmp:size=256m"]
    environment:
      FY_HOME: /fy
      FY_EXECUTOR: /work
      FY_RUNNER_SERVER: http://fortyard:8740
      TMPDIR: /tmp
      FY_EGRESS_EXTRA_FILE: /egress-extra/executor.txt
    volumes:
      - .:/fy:ro
      - work:/work
      # The extra hosts of the check it runs, for the executor proxy; the
      # executor does not mount them.
      - ./egress/extra:/egress-extra
    entrypoint: ["/fy/bin/start.sh", "runner"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    networks: [yard]
    depends_on: [fortyard]
  # The executor: no token, only the repositories (read-only), the releases
  # (read-only, to run the controller's) and the work volume. It runs the fy
  # of the release named in the controller's hand-over.
  fortyard-executor:
    <<: *fortyard
    container_name: fortyard-executor
    # Tests write to /var/tmp as on any Linux host, so it is writable too.
    tmpfs: ["/tmp:size=2g,exec", "/var/tmp:size=2g,exec"]
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      http_proxy: http://fortyard-egress-runner:3128
      https_proxy: http://fortyard-egress-runner:3128
      HTTP_PROXY: http://fortyard-egress-runner:3128
      HTTPS_PROXY: http://fortyard-egress-runner:3128
      no_proxy: 127.0.0.1,localhost
      NO_PROXY: 127.0.0.1,localhost
    volumes:
      - work:/work
      - ./data/repos:/fy/data/repos:ro
      - ./releases:/fy/releases:ro
      - cache:/cache
    entrypoint:
      - /bin/sh
      - -c
      - |
        w=$$1 r=$$2
        while :; do
          c=$$(sed -n 's/^commit=//p' "$$w/exchange/job" "$$w/exchange/taken" 2>/dev/null | head -n 1)
          d=$$(grep -l "^commit=$$c" "$$r"/*/RELEASE 2>/dev/null | head -n 1)
          if [ -n "$$c" ] && [ -n "$$d" ]; then "$${d%/RELEASE}/fy" executor "$$w"; fi
          sleep 1
        done
      - executor
      - /work
      - /fy/releases
    mem_limit: 6g
    cpus: 4
    pids_limit: 1024
    networks: [runner-out]
    depends_on: [fortyard-runner, fortyard-egress-runner]
  # Executor allowlist; the runner controller writes the extra hosts of the
  # check it runs to ./egress/extra/executor.txt, read-only here.
  fortyard-egress-runner:
    <<: *egress
    container_name: fortyard-egress-runner
    environment:
      FY_EGRESS_ROLE: executor
      FY_EGRESS_LEARN: "@LEARN@"
      FY_EGRESS_EXTRA: /extra/executor.txt
      FY_EGRESS_LOG: /log
    volumes:
      - ./egress/runner:/log
      - ./egress/extra:/extra:ro
    networks: [runner-out, egress]
volumes:
  cache:
  # Work trees and hand-over files, in memory as the runner's /tmp was;
  # shared by the two containers, which run as the same user.
  work:
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=2g,mode=1777"}
# FY_SUBNET (install-compose.sh) names the networks' subnets where Docker's
# own address pools are used up; without it the lines with @NET@ go.
networks:
  # Server, runner controller and relay.
  yard:
    internal: true
    ipam: {config: [{subnet: "@NET@.0/28"}]}
  # Each role and its own proxy, so no container uses another role's list.
  server-out:
    internal: true
    ipam: {config: [{subnet: "@NET@.16/28"}]}
  runner-out:
    internal: true
    ipam: {config: [{subnet: "@NET@.32/28"}]}
  # The proxies' way out and the relay's published port.
  egress:
    ipam: {config: [{subnet: "@NET@.48/28"}]}
  edge:
    ipam: {config: [{subnet: "@NET@.64/28"}]}
