# fortyard behind a reverse proxy at @BASE@. Releases are files under
# ./releases; the server follows ./current and becomes each new release
# itself, so the container is never rebuilt or restarted for an update.
services:
  fortyard:
    image: @IMAGE@
    container_name: fortyard
    restart: unless-stopped
    user: "@UID@"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=2g,exec"]
    environment:
      FY_HOME: /fy
      FY_URL: http://127.0.0.1:8740
      FY_BASE: "@BASE@"
      FY_RESTART: follow
      TMPDIR: /tmp
    volumes:
      - .:/fy
      - cache:/cache
    entrypoint: ["/fy/bin/start.sh"]
    mem_limit: 6g
    cpus: 4
    pids_limit: 1024
    networks: [proxy]
volumes:
  cache:
networks:
  proxy:
    external: true
    name: @NETWORK@
