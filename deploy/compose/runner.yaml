# A landing-check runner on a build host (scripts/install-runner.sh fills in
# the @...@ values). It runs `fy runner` in remote mode through
# scripts/remote-runner.sh: checks and repositories over the API, its own
# limits, nothing shared with the server's host.
services:
  fortyard-runner:
    image: "@IMAGE@"
    container_name: "@NAME@"
    restart: unless-stopped
    init: true
    user: "@UID@:@GID@"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=4g,exec"]
    environment:
      FY_TARGET: "@TARGET@"
      FY_RUNNER: "@HOME@"
      HOME: /tmp
      TMPDIR: "@HOME@/tmp"
      # Bounded caches that persist between checks (ccache and fo evict the
      # oldest entries themselves). Runners of one host share them, as both
      # take concurrent users; base_dir lets their work trees share hits.
      CCACHE_DIR: "@CACHE@/ccache"
      CCACHE_MAXSIZE: "20G"
      CCACHE_BASEDIR: "@HOME@/tmp/fy-work"
      FO_CACHE_DIR: "@CACHE@/fo"
      FO_CACHE_MAX_SIZE: "20G"
    volumes:
      - "@HOME@:@HOME@"
      - "@CACHE@:@CACHE@"
    entrypoint: ["@HOME@/bin/remote-runner.sh"]
    mem_limit: "@MEMORY@"
    cpus: "@CPUS@"
    pids_limit: 2048
