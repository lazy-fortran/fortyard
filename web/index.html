<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fortyard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23734f96'/%3E%3Cpath d='M5 4h6v1.6H6.8v1.7h3.6v1.6H6.8V12H5z' fill='white'/%3E%3C/svg%3E">
<meta name="fy-base" content="%BASE%">
<link rel="preload" href="%BASE%/app/%WASM%" as="fetch" type="application/wasm" crossorigin>
<style>%FORTUI_CSS%</style>
<style>
  /* Colours as GitHub's light and dark default themes; dark follows the
     system unless the person chose a theme (data-theme on <html>). */
  :root {
    color-scheme: light;
    --fg: #1f2328; --bg: #ffffff; --mut: #59636e; --acc: #0969da; --line: #d1d9e0;
    --line-mut: #d1d9e0b3; --sub: #f6f8fa; --ctl: #f6f8fa; --ctl-hover: #eff2f5;
    --hover: #818b981a; --sel: #818b9826; --head: #f6f8fa; --green: #1a7f37; --red: #d1242f;
    --badge-bg: #ffffff; --badge-fg: #59636e; --scrim: #1f232866; --shadow: 0 8px 24px #424a5333;
    --add-bg: #dafbe1; --add-gutter: #aceebb; --del-bg: #ffebe9; --del-gutter: #ffcecb;
    --hunk-bg: #ddf4ff; --new-bg: #dafbe1; --new-line: #1a7f3766; --code-inline: #818b981f;
    --kw: #cf222e; --str: #0a3069; --com: #59636e; --num: #0550ae; --typ: #953800; --pre: #8250df;
    --tab-sel: #fd8c73; --dir: #54aeff; --btn-go: #1f883d; --btn-go-hover: #1c8139;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --fg: #f0f6fc; --bg: #0d1117; --mut: #9198a1; --acc: #4493f8; --line: #3d444d;
      --line-mut: #3d444db3; --sub: #151b23; --ctl: #212830; --ctl-hover: #262c36;
      --hover: #656c7633; --sel: #656c7640; --head: #010409; --green: #3fb950; --red: #f85149;
      --badge-bg: #0d1117; --badge-fg: #9198a1; --scrim: #01040999; --shadow: 0 8px 24px #010409;
      --add-bg: #2ea04326; --add-gutter: #3fb9504d; --del-bg: #f851491a; --del-gutter: #f851494d;
      --hunk-bg: #388bfd1a; --new-bg: #2ea0431a; --new-line: #2ea04366; --code-inline: #656c7633;
      --kw: #ff7b72; --str: #a5d6ff; --com: #9198a1; --num: #79c0ff; --typ: #ffa657; --pre: #d2a8ff;
      --tab-sel: #f78166; --dir: #7d8590; --btn-go: #238636; --btn-go-hover: #29903b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fg: #f0f6fc; --bg: #0d1117; --mut: #9198a1; --acc: #4493f8; --line: #3d444d;
    --line-mut: #3d444db3; --sub: #151b23; --ctl: #212830; --ctl-hover: #262c36;
    --hover: #656c7633; --sel: #656c7640; --head: #010409; --green: #3fb950; --red: #f85149;
    --badge-bg: #0d1117; --badge-fg: #9198a1; --scrim: #01040999; --shadow: 0 8px 24px #010409;
    --add-bg: #2ea04326; --add-gutter: #3fb9504d; --del-bg: #f851491a; --del-gutter: #f851494d;
    --hunk-bg: #388bfd1a; --new-bg: #2ea0431a; --new-line: #2ea04366; --code-inline: #656c7633;
    --kw: #ff7b72; --str: #a5d6ff; --com: #9198a1; --num: #79c0ff; --typ: #ffa657; --pre: #d2a8ff;
    --tab-sel: #f78166; --dir: #7d8590; --btn-go: #238636; --btn-go-hover: #29903b;
  }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica,
    Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  #app { margin: 0; padding: 0; }
  .fui { color: var(--fg); }
  .fui[data-style="2"], .fui[data-tone="3"] { color: var(--mut); }
  .fui[data-tone="1"] { color: var(--green); }
  .fui[data-tone="2"] { color: var(--red); }
  .fui:focus, .fui:focus-visible { outline: none; }
  .fui-keyboard .fui-focus, .fui-k8:focus, a.fui-k9:focus-visible, .fui-k2:focus-visible,
  .fui-k5:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }

  /* Controls */
  .fui-k2 { border: 1px solid var(--line); border-radius: 6px; background: var(--ctl);
    color: var(--fg); cursor: pointer; padding: 0 16px; font-weight: 500; line-height: 20px; }
  .fui-k2:hover { background: var(--ctl-hover); }
  .fui-k2:disabled { color: var(--mut); cursor: default; }
  .fui-k8 { border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; height: 40px;
    background: var(--bg); color: var(--fg); font-size: 14px; }
  .fui-k8::placeholder { color: var(--mut); }
  .fui-k8:focus { border-color: var(--acc); outline: 1px solid var(--acc); outline-offset: -1px; }
  a.fui-k9 { color: var(--acc); }
  a.fui-k9[data-tone="0"], a.fui-k9[data-tone="15"] { color: var(--fg); }
  a.fui-k9[data-tone="3"] { color: var(--mut); }
  a.fui-k9[data-tone="0"]:hover, a.fui-k9[data-tone="3"]:hover { color: var(--acc); }
  .fui-k2[data-id$="/create"], .fui-k2[data-id$="/signin"], .fui-k2[data-id$="/add"],
  .fui-k2[data-id$="/clone"] {
    background: var(--btn-go); border-color: var(--btn-go); color: #fff; }
  .fui-k2[data-id$="/create"]:hover, .fui-k2[data-id$="/signin"]:hover,
  .fui-k2[data-id$="/add"]:hover, .fui-k2[data-id$="/clone"]:hover { background: var(--btn-go-hover); }
  .fui-k2[data-id*="/revoke#"], .fui-k2[data-id$="/signouthere"] { color: var(--red); }

  /* Icons: a mask in the text colour */
  .fui[data-id$="icon-dir"], .fui[data-id$="icon-file"], .fui[data-id$="icon-repo"],
  .fui[data-id$="icon-book"] { width: 16px; height: 16px; flex: 0 0 16px;
    background: var(--mut); -webkit-mask: var(--icon) no-repeat center / 16px;
    mask: var(--icon) no-repeat center / 16px; }
  .fui[data-id$="icon-dir"] { background: var(--dir); }
  [data-id$="/menu"]::before, [data-id$="/close"]::before, [data-box="sidebar"] a::before,
  [data-box="drawer"] a:not([data-id$="/home"])::before, [data-id$="/pin"]::before,
  [data-id$="/signout"]::before { content: ""; display: inline-block; width: 16px; height: 16px;
    flex: 0 0 16px; background: currentColor; -webkit-mask: var(--icon) no-repeat center / 16px;
    mask: var(--icon) no-repeat center / 16px; }

  /* Page frame: header, navigation, page */
  .fui-root > .fui-box { min-height: 100vh; }
  [data-box="top"] { background: var(--head); border-bottom: 1px solid var(--line);
    padding: 0 16px; flex-wrap: nowrap; }
  [data-id$="/menu"], [data-id$="/close"] { padding: 0; display: inline-flex; align-items: center;
    justify-content: center; font-size: 0 !important; background: transparent; color: var(--mut); }
  [data-id$="/menu"]:hover, [data-id$="/close"]:hover { background: var(--hover); color: var(--fg); }
  a[data-id$="home"]:hover { text-decoration: none; color: var(--fg); }
  a[data-id$="home"] { display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
    white-space: nowrap; padding: 8px 0; text-decoration: none; }
  a[data-id$="home"]::before { content: ""; width: 24px; height: 24px; border-radius: 6px;
    flex: 0 0 24px; background: #734f96 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M5 4h6v1.6H6.8v1.7h3.6v1.6H6.8V12H5z" fill="white"/></svg>') center / 20px no-repeat; }
  [data-box="context"] { min-width: 0; flex: 0 1 auto; overflow: hidden; }
  [data-box="context"] > .fui { white-space: nowrap; }
  [data-box="context"] a { font-weight: 600; padding: 8px 0; }
  [data-box="shell"] { align-items: stretch; flex: 1 1 auto; }
  [data-box="main"] { flex: 1 1 0; min-width: 0; padding: 24px 32px 48px; }
  [data-box="main"] > .fui-box { width: 100%; max-width: 1280px; margin: 0 auto; }
  [data-box="sidebar"], [data-box="drawer"] { padding: 12px 8px; background: var(--bg);
    box-sizing: border-box; }
  [data-box="sidebar"] { width: 272px; flex: 0 0 272px; border-right: 1px solid var(--line);
    position: sticky; top: 0; align-self: flex-start; min-height: calc(100vh - 65px); }
  [data-box="drawer"] { position: fixed; top: 0; left: 0; bottom: 0; z-index: 41;
    width: 320px; max-width: calc(100vw - 48px); overflow-y: auto; border-radius: 0 12px 12px 0;
    box-shadow: var(--shadow); padding: 8px 12px 16px; }
  [data-box="drawerhead"] { padding: 0 4px 8px 8px; }
  .fui-k2[data-id$="/scrim"] { position: fixed; inset: 0; z-index: 40; width: auto; height: auto !important;
    border: 0; border-radius: 0; background: var(--scrim); font-size: 0 !important; padding: 0;
    cursor: default; }
  [data-box="sidebar"] a.fui-k9, [data-box="drawer"] a.fui-k9:not([data-id$="/home"]),
  [data-id$="/pin"], [data-id$="/signout"] {
    display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px;
    border-radius: 6px; color: var(--fg); text-decoration: none; position: relative;
    border: 0; background: transparent; font-weight: 400; justify-content: flex-start; }
  [data-box="sidebar"] a.fui-k9::before, [data-box="drawer"] a.fui-k9::before { color: var(--mut); }
  [data-box="sidebar"] a.fui-k9:hover, [data-box="drawer"] a.fui-k9:not([data-id$="/home"]):hover,
  [data-id$="/pin"]:hover, [data-id$="/signout"]:hover { background: var(--hover); text-decoration: none; }
  [data-box="sidebar"] a.fui-k9[data-tone="15"], [data-box="drawer"] a.fui-k9[data-tone="15"] {
    background: var(--sel); font-weight: 600; }
  [data-box="sidebar"] a.fui-k9[data-tone="15"]::after, [data-box="drawer"] a.fui-k9[data-tone="15"]::after {
    content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px;
    border-radius: 6px; background: var(--acc); }
  [data-id$="/pin"], [data-id$="/signout"] { color: var(--fg); height: 36px !important; }
  [data-id$="/section"], [data-id$="/section2"] { padding: 8px 8px 4px; font-size: 12px !important; }
  [data-id$="/hr1"], [data-id$="/hr2"] { border-top: 1px solid var(--line); height: 0;
    margin: 8px 8px; align-self: stretch; }
  .fui-k5[data-id*="/theme#"] { height: 32px !important; border: 1px solid var(--line);
    background: var(--ctl); color: var(--mut); cursor: pointer; margin: 0 0 8px; }
  .fui-k5[data-id$="/theme#1"] { border-radius: 6px 0 0 6px; margin-left: 8px; }
  .fui-k5[data-id$="/theme#3"] { border-radius: 0 6px 6px 0; margin-right: 8px; }
  .fui-k5[data-id*="/theme#"] + .fui-k5 { border-left: 0; }
  .fui-k5[data-id*="/theme#"][aria-selected="true"] { background: var(--bg); font-weight: 600;
